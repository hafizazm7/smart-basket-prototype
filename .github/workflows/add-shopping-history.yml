name: Add shopping history

on:
  workflow_run:
    workflows: ["Publish high-fidelity Smart Basket prototype"]
    types: [completed]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add shopping history and simplify completion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # History styling
          css_anchor = '.store-setting{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}'
          css_add = '''.header-actions{display:flex;align-items:center;gap:8px}.history-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.history-summary-box{border:1px solid #d9eee4;border-radius:16px;padding:14px;background:var(--green-softer)}.history-summary-box strong{display:block;font-size:24px;color:var(--green);letter-spacing:-.5px}.history-summary-box span{display:block;margin-top:3px;font-size:11px;color:var(--muted);font-weight:750}.history-trip{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff;box-shadow:0 6px 18px rgba(24,36,31,.04);margin-bottom:12px}.history-trip-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.history-date{font-weight:850}.history-sub{font-size:11px;color:var(--muted);margin-top:4px}.history-saving{text-align:right;color:var(--green);font-size:20px;font-weight:950}.history-saving small{display:block;font-size:10px;color:var(--muted);font-weight:750;margin-top:2px}.history-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.history-metric{padding:9px 6px;border-radius:12px;background:#f7faf8;text-align:center}.history-metric strong{display:block;font-size:13px}.history-metric span{display:block;font-size:9px;color:var(--muted);margin-top:3px}.history-details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.history-details summary{cursor:pointer;color:var(--green);font-size:12px;font-weight:850}.history-store{margin-top:10px;padding:10px;border-radius:12px;background:#f8faf9}.history-store-title{display:flex;justify-content:space-between;font-size:12px;font-weight:850}.history-item{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:11px;color:#536159}.history-empty{text-align:center;padding:34px 16px;color:var(--muted)}\n'''
          if '.history-trip{' not in s:
              if css_anchor not in s:
                  raise SystemExit('History CSS anchor not found')
              s = s.replace(css_anchor, css_add + css_anchor, 1)

          # Add a permanent history shortcut in the header without changing the 4-tab navigation.
          old_header = '<button class="header-action" id="quickStores" aria-label="My Stores">⌁</button>'
          new_header = '<div class="header-actions"><button class="header-action" id="quickHistory" aria-label="Shopping history">◷</button><button class="header-action" id="quickStores" aria-label="My Stores">⌁</button></div>'
          if 'id="quickHistory"' not in s:
              if old_header not in s:
                  raise SystemExit('Header action anchor not found')
              s = s.replace(old_header, new_header, 1)

          # Add History screen before My Stores.
          stores_anchor = '  <section class="screen" id="storesScreen">\n'
          history_html = '''  <section class="screen" id="historyScreen">\n    <h1>Shopping history</h1>\n    <p class="sub">Check what you spent and how much Smart Basket helped you save on previous shopping trips.</p>\n    <div class="history-summary">\n      <div class="history-summary-box"><strong id="historyTotalSaved">€0.00</strong><span>Total saved</span></div>\n      <div class="history-summary-box"><strong id="historyTripCount">0</strong><span>Shopping trips</span></div>\n    </div>\n    <div id="historyList"></div>\n  </section>\n\n'''
          if 'id="historyScreen"' not in s:
              if stores_anchor not in s:
                  raise SystemExit('History screen anchor not found')
              s = s.replace(stores_anchor, history_html + stores_anchor, 1)

          # Replace Done with View shopping history.
          old_completion_buttons = '      <button class="primary" id="completeDone">Done</button>\n      <button class="secondary" id="completeNewList">Start a new list</button>'
          new_completion_buttons = '      <button class="primary" id="completeHistory">View shopping history</button>\n      <button class="secondary" id="completeNewList">Start a new list</button>'
          if 'id="completeHistory"' not in s:
              if old_completion_buttons not in s:
                  raise SystemExit('Completion buttons anchor not found')
              s = s.replace(old_completion_buttons, new_completion_buttons, 1)

          # Initialize local shopping history.
          history_state_anchor = "state.locals=Array.isArray(state.locals)?state.locals:['Yaşar'];\n"
          history_state_add = history_state_anchor + "state.history=Array.isArray(state.history)?state.history:[];\nstate.currentTripSaved=!!state.currentTripSaved;\n"
          if 'state.history=Array.isArray' not in s:
              if history_state_anchor not in s:
                  raise SystemExit('State history anchor not found')
              s = s.replace(history_state_anchor, history_state_add, 1)

          # Render History when opened.
          old_show = "if(name==='list')renderList();if(name==='compare')renderCompare();if(name==='shop')renderShop();if(name==='stores')renderStores();}"
          new_show = "if(name==='list')renderList();if(name==='compare')renderCompare();if(name==='shop')renderShop();if(name==='history')renderHistory();if(name==='stores')renderStores();}"
          if "if(name==='history')renderHistory()" not in s:
              if old_show not in s:
                  raise SystemExit('showScreen anchor not found')
              s = s.replace(old_show, new_show, 1)

          # Save each completed trip once, then render useful details later.
          completion_anchor = 'function showCompletion(p){\n'
          history_functions = '''function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}\nfunction saveCompletedTrip(p){\n  if(state.currentTripSaved)return;\n  const totalItems=p.stores.reduce((n,store)=>n+store.items.length,0);\n  const checked=p.stores.reduce((n,store)=>n+store.items.filter(item=>state.checks[store.name+'|'+item]).length,0);\n  const trip={id:Date.now(),completedAt:new Date().toISOString(),total:p.recommended,single:p.single,saving:p.saving,pct:p.pct,totalItems,checked,stores:p.stores.map(store=>({name:store.name,total:store.total,items:store.items.map(name=>({name,price:p.priceFor(name,store.name),checked:!!state.checks[store.name+'|'+name]}))}))};\n  state.history.unshift(trip);\n  state.currentTripSaved=true;\n  persist();\n}\nfunction renderHistory(){\n  const trips=state.history||[];\n  $('#historyTotalSaved').textContent=money(trips.reduce((sum,t)=>sum+Number(t.saving||0),0));\n  $('#historyTripCount').textContent=trips.length;\n  const box=$('#historyList');box.innerHTML='';\n  if(!trips.length){box.innerHTML='<div class="card history-empty"><div style="font-size:30px;margin-bottom:8px">◷</div><strong>No shopping history yet</strong><div class="helper" style="margin-top:6px">Completed trips will appear here.</div></div>';return}\n  trips.forEach((trip,index)=>{\n    const d=new Date(trip.completedAt);\n    const when=d.toLocaleString([], {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});\n    const card=document.createElement('div');card.className='history-trip';\n    const storeDetails=(trip.stores||[]).map(store=>'<div class="history-store"><div class="history-store-title"><span>'+esc(store.name)+'</span><span>'+money(store.total)+'</span></div>'+(store.items||[]).map(item=>'<div class="history-item"><span>'+(item.checked?'✓ ':'')+esc(item.name)+'</span><strong>'+money(item.price)+'</strong></div>').join('')+'</div>').join('');\n    card.innerHTML='<div class="history-trip-head"><div><div class="history-date">'+esc(when)+'</div><div class="history-sub">Trip #'+(trips.length-index)+'</div></div><div class="history-saving">+'+money(trip.saving)+'<small>'+Number(trip.pct||0)+'% saved</small></div></div><div class="history-metrics"><div class="history-metric"><strong>'+money(trip.total)+'</strong><span>Spent</span></div><div class="history-metric"><strong>'+((trip.stores||[]).length)+'</strong><span>Stores</span></div><div class="history-metric"><strong>'+Number(trip.checked||0)+'/'+Number(trip.totalItems||0)+'</strong><span>Items checked</span></div></div><details class="history-details"><summary>View trip details</summary>'+storeDetails+'<div class="soft-card" style="margin-top:10px"><div class="row space"><span>1-store basket</span><strong>'+money(trip.single)+'</strong></div><div class="row space" style="margin-top:7px"><span>You saved</span><strong style="color:var(--green)">'+money(trip.saving)+'</strong></div></div></details>';\n    box.appendChild(card);\n  });\n}\n\n'''
          if 'function renderHistory()' not in s:
              if completion_anchor not in s:
                  raise SystemExit('History functions anchor not found')
              s = s.replace(completion_anchor, history_functions + completion_anchor, 1)

          # Record the trip before showing the celebration.
          completion_body_anchor = 'function showCompletion(p){\n  const totalItems='
          completion_body_new = 'function showCompletion(p){\n  saveCompletedTrip(p);\n  const totalItems='
          if 'function showCompletion(p){\n  saveCompletedTrip(p);' not in s:
              if completion_body_anchor not in s:
                  raise SystemExit('Completion save anchor not found')
              s = s.replace(completion_body_anchor, completion_body_new, 1)

          # Header/history/completion interactions.
          quick_stores = "$('#quickStores').onclick=()=>showScreen('stores');\n"
          quick_both = "$('#quickHistory').onclick=()=>showScreen('history');\n" + quick_stores
          if "$('#quickHistory').onclick" not in s:
              if quick_stores not in s:
                  raise SystemExit('Quick history handler anchor not found')
              s = s.replace(quick_stores, quick_both, 1)

          old_done_handler = "$('#completeDone').onclick=()=>$('#completeModal').classList.remove('open');\n"
          new_history_handler = "$('#completeHistory').onclick=()=>{$('#completeModal').classList.remove('open');showScreen('history')};\n"
          if old_done_handler in s:
              s = s.replace(old_done_handler, new_history_handler, 1)
          elif "$('#completeHistory').onclick" not in s:
              raise SystemExit('Completion history handler anchor not found')

          old_start = "$('#startShopping').onclick=()=>{state.storeIndex=0;persist();showScreen('shop')};\n"
          new_start = "$('#startShopping').onclick=()=>{state.storeIndex=0;state.currentTripSaved=false;persist();showScreen('shop')};\n"
          if old_start in s:
              s = s.replace(old_start, new_start, 1)

          old_new_list = "$('#completeNewList').onclick=()=>{state.items=[];state.checks={};state.storeIndex=0;persist();$('#completeModal').classList.remove('open');showScreen('list');toast('Ready for a new list')};\n"
          new_new_list = "$('#completeNewList').onclick=()=>{state.items=[];state.checks={};state.storeIndex=0;state.currentTripSaved=false;persist();$('#completeModal').classList.remove('open');showScreen('list');toast('Ready for a new list')};\n"
          if old_new_list in s:
              s = s.replace(old_new_list, new_new_list, 1)

          p.write_text(s)
          PY
      - name: Commit history UX
        run: |
          git config user.name "Smart Basket Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add shopping history and remove Done action"
          git push
