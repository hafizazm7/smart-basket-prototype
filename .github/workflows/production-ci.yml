name: Production app CI

on:
  push:
    paths:
      - 'production/**'
      - '.github/workflows/production-ci.yml'
  pull_request:
    paths:
      - 'production/**'
      - '.github/workflows/production-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
