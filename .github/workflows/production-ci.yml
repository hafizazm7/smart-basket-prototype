name: Production app CI

on:
  push:
    paths:
      - 'production/**'
      - '.github/workflows/production-ci.yml'
  pull_request:
    paths:
      - 'production/**'
      - '.github/workflows/production-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Run product matching self-check
        run: |
          npm start -- -p 3001 > /tmp/smart-basket-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api/product-matching/status -o /tmp/matching-status.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/matching-status.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/matching-status.json','utf8')); if(!x.ok){process.exit(1)}"
