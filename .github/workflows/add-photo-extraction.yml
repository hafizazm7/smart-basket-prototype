name: Add automatic photo extraction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prototype
        run: |
          python scripts/patch_photo.py
          python scripts/patch_list_default.py
          git config user.name "Smart Basket Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Prototype patches already present."
            exit 0
          fi
          git commit -m "Apply automatic photo extraction and default multi-item entry"
          git push
