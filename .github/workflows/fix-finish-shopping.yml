name: Publish high-fidelity Smart Basket prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index.html from approved prototype payload
        run: |
          base64 -d .github/proto.b64 | gzip -d > index.html
      - name: Commit rebuilt prototype
        run: |
          git config user.name "Smart Basket Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild prototype to match approved UX v1.0"
          git push
