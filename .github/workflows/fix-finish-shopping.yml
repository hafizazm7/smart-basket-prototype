name: Publish high-fidelity Smart Basket prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index.html from approved prototype payload
        run: |
          base64 -d .github/proto.b64 | gzip -d > index.html
      - name: Add two-way store navigation in Shopping Mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css_anchor = '.completion.show{display:block}\n'
          css_patch = '''.completion.show{display:block}\n.shop-store-tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0 2px;padding:1px 0 3px;scrollbar-width:none}.shop-store-tabs::-webkit-scrollbar{display:none}.shop-store-tab{flex:1 0 auto;min-width:112px;height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;color:#65726b;font-size:12px;font-weight:850;padding:0 12px}.shop-store-tab.active{border-color:var(--green);background:var(--green-soft);color:var(--green);box-shadow:0 4px 12px rgba(20,122,88,.08)}.shop-nav-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shop-nav-actions .secondary{width:100%;min-height:54px}.shop-nav-actions button:disabled{cursor:default;opacity:.42}\n'''
          if '.shop-store-tabs{' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_patch, 1)

          html_anchor = '    <div class="section-title">Buy here</div>\n'
          html_patch = '    <div class="shop-store-tabs" id="shopStoreTabs" aria-label="Switch store"></div>\n\n    <div class="section-title">Buy here</div>\n'
          if 'id="shopStoreTabs"' not in s:
              if html_anchor not in s:
                  raise SystemExit('Shop tab HTML anchor not found')
              s = s.replace(html_anchor, html_patch, 1)

          old_buttons = '    <div style="height:16px"></div>\n    <button class="primary" id="nextStore">Next store</button>\n'
          new_buttons = '    <div style="height:16px"></div>\n    <div class="shop-nav-actions">\n      <button class="secondary" id="prevStore">← Previous store</button>\n      <button class="primary" id="nextStore">Next store →</button>\n    </div>\n'
          if 'id="prevStore"' not in s:
              if old_buttons not in s:
                  raise SystemExit('Shop navigation HTML anchor not found')
              s = s.replace(old_buttons, new_buttons, 1)

          js_anchor = "  $('#storeCounter').textContent='STORE '+(state.storeIndex+1)+' OF '+p.stores.length;$('#shopStoreName').textContent=s.name;$('#shopStoreTotal').textContent=money(s.total);$('#freshnessText').textContent='Updated today';\n"
          js_patch = js_anchor + "  const tabs=$('#shopStoreTabs');tabs.innerHTML='';p.stores.forEach((store,i)=>{const b=document.createElement('button');b.className='shop-store-tab'+(i===state.storeIndex?' active':'');b.textContent=store.short+' '+(i+1)+'/'+p.stores.length;b.setAttribute('aria-label','Open '+store.name);b.onclick=()=>{state.storeIndex=i;persist();renderShop();window.scrollTo({top:0,behavior:'smooth'})};tabs.appendChild(b)});\n"
          if "const tabs=$('#shopStoreTabs')" not in s:
              if js_anchor not in s:
                  raise SystemExit('renderShop header anchor not found')
              s = s.replace(js_anchor, js_patch, 1)

          old_render_end = "  const final=state.storeIndex===p.stores.length-1;$('#nextStore').textContent=final?'Finish shopping':'Next store';$('#shoppingDone').classList.remove('show');$('#nextStore').disabled=false;$('#nextStore').style.opacity='1';\n"
          new_render_end = "  const final=state.storeIndex===p.stores.length-1;const first=state.storeIndex===0;$('#prevStore').disabled=first;$('#nextStore').textContent=final?'Finish shopping':'Next store →';$('#shoppingDone').classList.remove('show');$('#nextStore').disabled=false;$('#nextStore').style.opacity='1';\n"
          if old_render_end in s:
              s = s.replace(old_render_end, new_render_end, 1)
          elif "$('#prevStore').disabled=first" not in s:
              raise SystemExit('renderShop footer anchor not found')

          next_handler = "$('#nextStore').onclick=()=>{const p=getStorePlan();if(state.storeIndex<p.stores.length-1){state.storeIndex++;persist();renderShop();window.scrollTo({top:0,behavior:'smooth'})}else{$('#shoppingDone').classList.add('show');$('#nextStore').textContent='Shopping completed ✓';$('#nextStore').disabled=true;$('#nextStore').style.opacity='.65';toast('Shopping complete')}};\n"
          prev_handler = "$('#prevStore').onclick=()=>{if(state.storeIndex>0){state.storeIndex--;persist();renderShop();window.scrollTo({top:0,behavior:'smooth'})}};\n"
          if "$('#prevStore').onclick" not in s:
              if next_handler not in s:
                  raise SystemExit('Next-store handler anchor not found')
              s = s.replace(next_handler, prev_handler + next_handler, 1)

          p.write_text(s)
          PY
      - name: Add rewarding completion summary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css_anchor = '.shop-nav-actions button:disabled{cursor:default;opacity:.42}\n'
          css_add = '''.shop-nav-actions button:disabled{cursor:default;opacity:.42}\n.celebrate-modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(14,31,24,.52);backdrop-filter:blur(8px)}.celebrate-modal.open{display:flex}.celebrate-card{position:relative;width:min(100%,420px);overflow:hidden;border-radius:28px;background:#fff;padding:30px 22px 22px;text-align:center;box-shadow:0 28px 70px rgba(10,35,25,.28);animation:celebratePop .32s ease-out}.celebrate-icon{width:78px;height:78px;margin:0 auto 15px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-size:42px;font-weight:950;animation:checkPop .45s cubic-bezier(.2,.9,.25,1.25)}.celebrate-eyebrow{font-size:11px;font-weight:900;letter-spacing:.9px;color:var(--green);text-transform:uppercase}.celebrate-title{font-size:27px;font-weight:950;letter-spacing:-.6px;margin:7px 0 18px}.celebrate-save-label{font-size:13px;color:var(--muted);font-weight:800}.celebrate-save{font-size:47px;line-height:1;font-weight:950;color:var(--green);letter-spacing:-1.4px;margin:5px 0 6px}.celebrate-pct{font-size:13px;color:var(--green-dark);font-weight:850}.celebrate-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 12px}.celebrate-stat{border:1px solid var(--line);border-radius:15px;padding:11px 7px;background:#fbfdfc}.celebrate-stat strong{display:block;font-size:16px}.celebrate-stat span{display:block;margin-top:4px;font-size:10px;color:var(--muted);line-height:1.2}.celebrate-items{font-size:12px;color:#4e5a54;font-weight:750}.celebrate-note{font-size:10px;color:var(--muted);line-height:1.4;margin:8px 0 17px}.celebrate-card .secondary{width:100%;margin-top:9px}.confetti{position:absolute;top:-18px;width:7px;height:18px;border-radius:3px;opacity:.82;animation:confettiFall 1.7s ease-in forwards}.confetti:nth-child(1){left:8%;background:#147a58;animation-delay:.05s;transform:rotate(14deg)}.confetti:nth-child(2){left:19%;background:#f1aa3c;animation-delay:.18s;transform:rotate(-18deg)}.confetti:nth-child(3){left:32%;background:#00a6dd;animation-delay:.02s;transform:rotate(24deg)}.confetti:nth-child(4){left:45%;background:#e86e78;animation-delay:.23s;transform:rotate(-12deg)}.confetti:nth-child(5){left:58%;background:#147a58;animation-delay:.10s;transform:rotate(17deg)}.confetti:nth-child(6){left:70%;background:#f1aa3c;animation-delay:.28s;transform:rotate(-28deg)}.confetti:nth-child(7){left:82%;background:#00a6dd;animation-delay:.14s;transform:rotate(12deg)}.confetti:nth-child(8){left:91%;background:#e86e78;animation-delay:.04s;transform:rotate(-22deg)}@keyframes celebratePop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}@keyframes checkPop{0%{transform:scale(.55);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes confettiFall{0%{transform:translateY(-15px) rotate(0);opacity:0}12%{opacity:.9}100%{transform:translateY(420px) rotate(260deg);opacity:0}}\n'''
          if '.celebrate-modal{' not in s:
              if css_anchor not in s:
                  raise SystemExit('Completion CSS anchor not found')
              s = s.replace(css_anchor, css_add, 1)

          nav_anchor = '  <nav class="bottom-nav" id="bottomNav">\n'
          modal_html = '''  <div class="celebrate-modal" id="completeModal" role="dialog" aria-modal="true" aria-labelledby="completeTitle">\n    <div class="celebrate-card">\n      <i class="confetti"></i><i class="confetti"></i><i class="confetti"></i><i class="confetti"></i><i class="confetti"></i><i class="confetti"></i><i class="confetti"></i><i class="confetti"></i>\n      <div class="celebrate-icon">✓</div>\n      <div class="celebrate-eyebrow">Smart Basket win</div>\n      <div class="celebrate-title" id="completeTitle">Shopping complete 🎉</div>\n      <div class="celebrate-save-label">You saved</div>\n      <div class="celebrate-save" id="completeSaved">€0.00</div>\n      <div class="celebrate-pct" id="completePct">0% saved vs 1 store</div>\n      <div class="celebrate-stats">\n        <div class="celebrate-stat"><strong id="completeTotal">€0.00</strong><span>Your basket</span></div>\n        <div class="celebrate-stat"><strong id="completeSingle">€0.00</strong><span>1-store basket</span></div>\n        <div class="celebrate-stat"><strong id="completeStores">0</strong><span>Stores visited</span></div>\n      </div>\n      <div class="celebrate-items" id="completeItems"></div>\n      <div class="celebrate-note">Savings are based on the recommended basket and current available prices.</div>\n      <button class="primary" id="completeDone">Done</button>\n      <button class="secondary" id="completeNewList">Start a new list</button>\n    </div>\n  </div>\n\n'''
          if 'id="completeModal"' not in s:
              if nav_anchor not in s:
                  raise SystemExit('Completion modal HTML anchor not found')
              s = s.replace(nav_anchor, modal_html + nav_anchor, 1)

          function_anchor = 'function storeLogoFor(name){'
          function_add = '''function showCompletion(p){\n  const totalItems=p.stores.reduce((n,store)=>n+store.items.length,0);\n  const checked=p.stores.reduce((n,store)=>n+store.items.filter(item=>state.checks[store.name+'|'+item]).length,0);\n  $('#completeSaved').textContent=money(p.saving);\n  $('#completePct').textContent=p.pct+'% saved vs cheapest 1-store basket';\n  $('#completeTotal').textContent=money(p.recommended);\n  $('#completeSingle').textContent=money(p.single);\n  $('#completeStores').textContent=p.stores.length;\n  $('#completeItems').textContent=checked+' of '+totalItems+' items checked';\n  $('#completeModal').classList.add('open');\n  $('#shoppingDone').textContent='✓ Shopping complete — you saved '+money(p.saving)+'!';\n  $('#shoppingDone').classList.add('show');\n  $('#nextStore').textContent='Shopping completed ✓';\n  $('#nextStore').disabled=true;\n  $('#nextStore').style.opacity='.65';\n}\n\n'''
          if 'function showCompletion(p)' not in s:
              if function_anchor not in s:
                  raise SystemExit('Completion function anchor not found')
              s = s.replace(function_anchor, function_add + function_anchor, 1)

          old_handler = "$('#nextStore').onclick=()=>{const p=getStorePlan();if(state.storeIndex<p.stores.length-1){state.storeIndex++;persist();renderShop();window.scrollTo({top:0,behavior:'smooth'})}else{$('#shoppingDone').classList.add('show');$('#nextStore').textContent='Shopping completed ✓';$('#nextStore').disabled=true;$('#nextStore').style.opacity='.65';toast('Shopping complete')}};\n"
          new_handler = "$('#nextStore').onclick=()=>{const p=getStorePlan();if(state.storeIndex<p.stores.length-1){state.storeIndex++;persist();renderShop();window.scrollTo({top:0,behavior:'smooth'})}else{showCompletion(p)}};\n$('#completeDone').onclick=()=>$('#completeModal').classList.remove('open');\n$('#completeNewList').onclick=()=>{state.items=[];state.checks={};state.storeIndex=0;persist();$('#completeModal').classList.remove('open');showScreen('list');toast('Ready for a new list')};\n"
          if old_handler in s:
              s = s.replace(old_handler, new_handler, 1)
          elif 'showCompletion(p)' not in s.split("$('#nextStore').onclick",1)[-1]:
              raise SystemExit('Completion handler anchor not found')

          p.write_text(s)
          PY
      - name: Commit rebuilt prototype
        run: |
          git config user.name "Smart Basket Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add savings celebration to shopping completion"
          git push
